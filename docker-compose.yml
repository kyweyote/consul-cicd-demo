services:
  consul:
    image: hashicorp/consul:1.16
    command: agent -dev -client=0.0.0.0
    ports:
      - "8500:8500"   # Consul UI/API
    networks:
      - appnet

  registrator:
    image: docker:cli
    command: sh -c "apk add --no-cache curl bash && sleep 10 && /register.sh"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./register-services.sh:/register.sh:ro
    depends_on:
      - consul
      - counting
      - dashboard
    network_mode: host
    restart: "no"

  counting:
    image: 200325/counting-service:latest
    environment:
      - PORT=9003
    expose:
      - "9003"
    networks:
      - appnet
    restart: always

  dashboard:
    image: 200325/dashboard-service:latest
    environment:
      - PORT=9002
      - COUNTING_SERVICE_URL=http://counting:9003
    expose:
      - "9002"
    depends_on:
      - counting
    networks:
      - appnet
    restart: always

  dashboard-lb:
    image: nginx:alpine
    ports:
      - "8080:8080"
    volumes:
      - ./nginx-dashboard.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - dashboard
    networks:
      - appnet
    restart: always

networks:
  appnet:
    driver: bridge

name: Build and Push Docker Images

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*.*.*"
    # paths:
    #   - .github/workflows/**

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Extract metadata for counting-service
        id: meta-counting
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_HUB_USER }}/counting-service
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest

      - name: Build and push counting-service
        uses: docker/build-push-action@v5
        with:
          context: ./counting-service
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-counting.outputs.tags }}
          labels: ${{ steps.meta-counting.outputs.labels }}

      - name: Extract metadata for dashboard-service
        id: meta-dashboard
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_HUB_USER }}/dashboard-service
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest

      - name: Build and push dashboard-service
        uses: docker/build-push-action@v5
        with:
          context: ./dashboard-service
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-dashboard.outputs.tags }}
          labels: ${{ steps.meta-dashboard.outputs.labels }}
